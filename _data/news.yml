  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7377606778261413889/
- date: '2025-09-23'
  body: INSAIT announces GAIA 2025, the first international symposium on Geospatial
    AI and Applications with Foundation Models, hosted in Sofia.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7376163674966892544/
- date: '2025-09-18'
