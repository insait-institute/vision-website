  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7345713769286676480/
- date: '2025-06-27'
  body: '[ObjectRelator](https://arxiv.org/pdf/2411.19083) wins 2nd place in the Ego-Exo4D
    Challenge at the CVPR 2025 EgoVis Workshop, advancing cross-view object relation
    understanding for egocentric and exocentric video.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7344266727276347393/
- date: '2025-06-19'
  body: INSAIT's work on [multi-modal semantic segmentation under sensor failures](/publications/benchmarking-multi-modal-semantic-segmentation-under-sensor-failures-missing-and-noisy-modality-robu/)
    wins Best Paper at the CVPR 2025 TMM-OpenWorld Workshop. The paper studies robustness
    when sensors are missing or noisy in real-world multimodal systems.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7341369237979942913/
- date: '2025-06-14'
  body: INSAIT presents 7 accepted papers at CVPR 2025, strengthening Bulgaria's presence
    at the leading computer-vision conference.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7339565454857764864/
- date: '2025-06-13'
  body: '[SceneSplat](/demos/scenesplat/) is released for instant 3D object discovery
    from text in photorealistic Gaussian-splat scenes. The system enables open-vocabulary
    interaction directly in 3D space.'
  link_url: https://insait.ai/insait-and-collaborators-launch-scenesplat-a-breakthrough-in-open-vocabulary-3d-scene-understanding/
- date: '2025-06-09'
  body: '[EarthMind](https://insait.ai/insait-unveils-earthmind-a-pioneering-ai-model-for-earth-observation/)
    is released as a foundation model for multimodal Earth observation and geospatial
    AI, combining visual, radar, and multi-spectral satellite data.'
  link_url: https://insait.ai/insait-unveils-earthmind-a-pioneering-ai-model-for-earth-observation/
- date: '2025-06-06'
  body: '[Exploration-Driven Generative Interactive Environments](/publications/exploration-driven-generative-interactive-environments/)
    is accepted to CVPR 2025. The work introduces an auto-exploration pipeline for
    training generative interactive environments without human demonstrations.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7336652935277219840/
- date: '2025-05-23'
  body: >-
    [ReVLA](/publications/revla-reverting-visual-domain-limitation-of-robotic-foundation-models/)
    is accepted to ICRA 2025, the first Bulgarian paper at the conference in years.
    [Sombit Dey](/people/sombit-dey/), [Nikolay Nikolov](/people/nikolay-nikolov/),
    [Luc Van Gool](/people/luc-van-gool/), and [Danda Paudel](/people/danda-paudel/)
    show that gradual backbone reversal restores visual robustness when robotic
    foundation models leave their training domain.
  link_url: https://insait.ai/insait-makes-history-at-icra-2025-with-breakthrough-research-in-robotic-visual-generalization/
- date: '2025-04-07'
  body: >-
    vivo and INSAIT announce a partnership on 3D scene understanding for mobile
    applications, including research funding for doctoral and postdoctoral work
    on scene understanding, intuitive editing, and interactive 3D experiences.
  link_url: https://insait.ai/insait-and-vivo-announce-partnership-on-3d-scene-understanding/
- date: '2024-09-27'
  body: >-
    INSAIT joins ECCV 2024 in Milan with 17 accepted papers spanning vision-language
    models, 3D segmentation, and related topics, and hosts booth 48.
  link_url: https://insait.ai/insait-is-heading-to-eccv2024-in-milan-from-29-september-to-04-october/
- date: '2024-07-12'
  body: >-
    INSAIT has 17 papers accepted at ECCV 2024, spanning text-to-image diffusion,
    vision-language models, open-vocabulary tracking, semantic segmentation, and
    3D segmentation. Authors include [Luc Van Gool](/people/luc-van-gool/), [Danda
    Paudel](/people/danda-paudel/), [Ajad Chhatkuli](/people/ajad-chhatkuli/), [Lei
    Sun](/people/lei-sun/), and [Saman Motamed](/people/sam-motamed/).
  link_url: https://insait.ai/17-eccv-papers-accepted/
- date: '2024-07-12'
  body: >-
    [Ternary-type Opacity and Hybrid Odometry for RGB-only NeRF-SLAM](/publications/ternary-type-opacity-and-hybrid-odometry-for-rgb-only-nerf-slam/)
    is accepted to IROS 2024. [Asen Nachkov](/people/asen-nachkov/), [Luc Van Gool](/people/luc-van-gool/),
    and [Danda Paudel](/people/danda-paudel/) replace binary opacity with ternary-type
    opacity so RGB-only NeRF-SLAM can optimize opaque surfaces more reliably.
  link_url: https://insait.ai/insait-with-first-accepted-paper-at-iros/
- date: '2024-04-10'
  body: >-
    Toyota and INSAIT begin a collaboration on AI and robotics led by [Luc Van Gool](/people/luc-van-gool/).
    The first step funds PhD research toward Toyota's Human Support Robot initiative,
    combining computer vision and language for longer independent living.
  link_url: https://insait.ai/toyota-insait-collaboration/
- date: '2024-03-26'
  body: >-
    INSAIT has 16 papers accepted at CVPR 2024, placing Bulgaria in the top 10
    countries by acceptances. The papers cover multimodal AI, autonomous driving,
    generative models, and foundation models.
  link_url: https://insait.ai/cvpr-2024/
- date: '2023-10-10'
  body: >-
    INSAIT presents 5 papers at ICCV 2023 in Paris, the first time a Bulgarian
    institution appears at the conference. The work covers object pop-out, deformable
    neural radiance fields from RGB and event cameras, online lane-graph extraction,
    Manhattan-scene reconstruction, and face inpainting.
  link_url: https://insait.ai/iccv-2023/
