    and autonomous driving.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7352973752411840512/
- date: '2025-07-18'
  body: '[GaussianVLM](/demos/gaussianvlm/) is released as a 3D vision-language model
    for understanding immersive Gaussian-splat scenes reconstructed from ordinary
    video.'
  link_url: https://insait.ai/gaussianvlm/
- date: '2025-07-11'
  body: '[Zhendong Li](/people/zhendong-li/) joins INSAIT as a doctoral student in
