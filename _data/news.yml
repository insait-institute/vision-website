# Vision Lab news feed (used by /news/)
# body: Markdown (inline links to people, demos, publications)
- date: '2026-09-17'
  body: >-
    INSAIT wraps up ECCV 2026 in Malmö with 10 main-track papers, ranking 5th
    among EU institutions. Work presented there includes [FrameWorkers](/demos/frameworkers/),
    [VOID](/demos/void/), event-camera video reconstruction, and cross-view video
    generation, alongside GAIA, OpenSUN3D, and the Articulate3D Challenge.
  link_url: https://insait.ai/insait-wraps-up-eccv-2026-in-malmo/
- date: '2026-09-11'
  body: >-
    ECCV 2026 is underway in Malmö. INSAIT brings 10 main-track papers spanning
    event-based video reconstruction, multimodal retrieval, weather synthesis,
    video editing, 3D motion, and agents for visual workflows, with live demos
    at booth #28.
  link_url: https://insait.ai/insait-brings-cutting-edge-ai-research-to-eccv-2026/
- date: '2026-09-08'
  body: >-
    INSAIT announces 10 accepted papers at ECCV 2026, plus a workshop paper, a
    demo, and two co-organized workshops and challenges. The program covers robotics,
    spatial reasoning, egocentric vision, Earth observation, visual agents, and
    agentic vision.
  link_url: https://insait.ai/insait-with-10-accepted-papers-at-the-european-conference-on-computer-vision-eccv-2026/
- date: '2026-09-07'
  body: >-
    The second [GAIA](/demos/gaia/) workshop on Geospatial AI and Foundation Models
    is held at ECCV 2026. The program covers vision-language models for remote
    sensing, spatial reasoning, multimodal fusion, generative Earth simulation,
    and foundation models for extraterrestrial data.
  link_url: https://insait.ai/the-second-edition-of-gaia-at-eccv-2026/
- date: '2026-08-13'
  body: >-
    [Mario Markov](/people/mario-markov/) discusses [FireScope](/demos/firescope/)
    on Bulgarian National Radio, covering how the wildfire-risk platform is evolving
    into a long-term prevention and decision-support tool. FireScope is now available
    in Bulgarian and 42 additional languages across Europe and Asia.
  link_url: https://insait.ai/how-can-ai-help-us-better-understand-and-prevent-wildfire-risk/
- date: '2026-08-05'
  body: >-
    [FireScope](/demos/firescope/) expands across a large part of Asia, with localized
    explanations in 43 languages. On the Asian evaluation it assigns higher long-term
    risk to burned locations more reliably than the Fire Weather Index.
  link_url: https://insait.ai/firescope-ai-is-expanding-to-asia/
- date: '2026-07-03'
  body: >-
    [FireScope](/demos/firescope/) leads Bulgaria's national television morning
    show. [Mario Markov](/people/mario-markov/) explains how the wildfire-risk
    map turns satellite and climate signals into a practical prevention tool.
  link_url: https://insait.ai/firescope-ai-featured-on-national-television-as-a-leading-story/
- date: '2026-06-22'
  body: >-
    Five group researchers are named CVPR 2026 Outstanding Reviewers, a distinction
    given to the top 5% of 17,491 reviewers: [Anna-Maria Halacheva](/people/anna-maria-halacheva/),
    [Nedyalko Prisadnikov](/people/nedyalko-prisadnikov/), [Stefan Ailuro](/people/stefan-ailuro/),
    [Nikola Popovic](/people/nikola-popovic/), and [Danda Paudel](/people/danda-paudel/).
  link_url: https://insait.ai/insait-researchers-recognized-as-cvpr-2026-outstanding-reviewers/
- date: '2026-06-21'
  body: >-
    Aleksandar Yanev, a third-year student at Sofia University and an EXPLORER
    fellow, becomes the first Bulgarian university student to co-author a CVPR
    paper. The paper is [SPEAR-1](/demos/spear-1/), a robotics foundation model
    trained with 3D understanding.
  link_url: https://insait.ai/first-bulgarian-university-student-to-co-author-a-cvpr-paper/
- date: '2026-06-08'
  body: >-
    INSAIT [showcases 17 accepted papers at CVPR 2026](https://insait.ai/insait-showcases-17-accepted-papers-and-emerging-ai-research-at-cvpr-2026/)
    at booth #440 in Denver, with live demos across robotics, spatial reasoning, earth
    observation, egocentric vision, visual agents, and visual media.
  link_url: https://insait.ai/insait-showcases-17-accepted-papers-and-emerging-ai-research-at-cvpr-2026/
- date: '2026-06-02'
  body: >-
    [SPEAR-1](/demos/spear-1/) is presented at CVPR 2026. The model reaches state-of-the-art
    robot manipulation while using about 20x less robotics data, by pretraining
    on both robot demonstrations and abundant non-robot 3D data.
  link_url: https://insait.ai/spear-1-is-coming-to-cvpr-2026/
- date: '2026-05-29'
  body: >-
    [FireScope](/demos/firescope/) is released as the first public high-resolution
    wildfire-risk map for Europe, together with FireScope-Bench. The system reasons
    over Sentinel-2 imagery and climate variables and is accepted to CVPR 2026.
    The team includes [Mario Markov](/people/mario-markov/), [Stefan Ailuro](/people/stefan-ailuro/),
    [Luc Van Gool](/people/luc-van-gool/), and [Danda Paudel](/people/danda-paudel/).
  link_url: https://insait.ai/announcing-firescope-ai-the-first-public-wildfire-risk-map-for-europe/
- date: '2026-05-27'
  body: INSAIT announces [17 papers at CVPR 2026](https://insait.ai/insait-among-europes-top-institutions-at-cvpr-2026/),
    its strongest computer-vision presence so far. The accepted work spans robotics,
    spatial reasoning, egocentric vision, earth observation, visual agents, and agentic
    vision.
  link_url: https://insait.ai/insait-among-europes-top-institutions-at-cvpr-2026/
- date: '2026-05-20'
  body: '[Nikolay Nikolov](/people/nikolay-nikolov/) presents INSAIT''s latest Physical
    AI work at Google Cloud Day Sofia, focusing on systems that scale beyond robots
    trained only from demonstrations.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7462758282538176512/
- date: '2026-05-12'
  body: Bulgarian government ministers visit INSAIT and meet the Computer Vision group
    leadership, including [Luc Van Gool](/people/luc-van-gool/), to discuss the institute's
    next stage of development and strategic role for Bulgaria.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7459865655576600576/
- date: '2026-04-30'
  body: '[Asen Nachkov](/people/asen-nachkov/) discusses autonomous-vehicle research
    and [DiffSim Trinity](/demos/diffsim-trinity/) in Bulgarian media. The work studies
    differentiable simulation as a path toward safer, more data-efficient autonomous
    driving.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7455523842334203905/
- date: '2026-04-23'
  body: Lorenzo Venturoli joins INSAIT for a Master's thesis in 3D computer vision,
    bringing experience in 3D semantics, SLAM, and multimodal benchmarks.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7452986614546456576/
- date: '2026-04-21'
  body: '[EgoNight](/demos/egonight/) is released at ICLR 2026 as a benchmark for
    nighttime egocentric vision. The project introduces aligned day-night videos,
    nighttime VQA, depth estimation, and cross-illumination retrieval to test vision
    systems beyond daytime conditions.'
  link_url: https://insait.ai/insait-introduces-egonight-a-benchmark-for-egocentric-ai-vision-in-low-light-conditions/
- date: '2026-04-10'
  body: '[Anna-Maria Halacheva](/people/anna-maria-halacheva/) discusses Articulate3D,
    robotics, and her research path on the Superhuman podcast with Georgi Nenov.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7448269480448757760/
- date: '2026-04-08'
  body: '[VOID](/demos/void/) is launched in collaboration with Netflix as an open
    model for video object and interaction deletion. The model removes objects while
    reconstructing physically plausible scene dynamics rather than only filling pixels.'
  link_url: https://insait.ai/insait-and-netflix-develop-ai-model-that-realistically-removes-objects-from-video/
- date: '2026-03-31'
  body: '[Hongyu An](/people/hongyu-an/) joins INSAIT as a PhD student in Computer
    Vision with [Luc Van Gool](/people/luc-van-gool/) and [Jinjin Gu](/people/jinjin-gu/).
    His work focuses on image/video super-resolution, restoration, and generative
    diffusion models.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7444645195289280513/
- date: '2026-03-25'
  body: '[Mengshun Hu](/people/mengshun-hu/) joins INSAIT as a postdoctoral researcher
    in Computer Vision. His research focuses on video restoration, space-time video
    super-resolution, and emerging VideoAgent systems.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7442489517087031297/
- date: '2026-03-16'
  body: INSAIT announces 8 accepted ICLR 2026 papers, placing Bulgaria first in Eastern
    Europe by accepted publications at the conference. Several of the accepted works
    connect to vision, multimodal AI, and embodied reasoning.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7439235939564105728/
- date: '2026-02-25'
  body: '[Taewoo Kim](/people/taewoo-kim/) joins INSAIT as a postdoctoral researcher
    in Computer Vision and computational imaging. His work connects event-based cameras,
    low-light enhancement, video generation/editing, and agentic AI.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7432340644636979200/
- date: '2026-02-18'
  body: INSAIT launches the [CVPR 2026 Workshop on Agentic AI for Visual Media](/demos/aavm-cvpr-2026/),
    led by [Jinjin Gu](/people/jinjin-gu/) and [Lei Sun](/people/lei-sun/) in collaboration
    with Snap and Adobe. The workshop focuses on AI systems that reason, plan, and
    execute multi-step visual-media workflows.
  link_url: https://insait.ai/insait-launches-cvpr-2026-workshop-on-agentic-ai-for-visual-media/
- date: '2026-02-11'
  body: >-
    [Anna-Maria Halacheva](/people/anna-maria-halacheva/) co-organizes the 6th Workshop
    on Open-World 3D Scene Understanding at CVPR 2026, with ETH Zurich, the Max
    Planck Institute, Google, NVIDIA, TUM, Stanford, and others. One challenge
    track builds on Articulate3D.
  link_url: https://insait.ai/insait-and-leading-global-institutions-organize-a-special-workshop-at-cvpr-2026/
- date: '2026-02-02'
  body: >-
    Google awards INSAIT $500,000 to continue research in computer vision, robotics,
    and machine learning, extending a partnership that began with the institute's
    launch.
  link_url: https://insait.ai/google-awards-500000-to-insait/
- date: '2026-01-19'
  body: '[Asen Nachkov](/people/asen-nachkov/) discusses [DiffSim Trinity](/demos/diffsim-trinity/)
    and safer autonomous driving on Bloomberg TV Bulgaria, explaining how differentiable
    simulation supports more reliable planning.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7418932064646967296/
- date: '2026-01-16'
  body: '[Asen Nachkov](/people/asen-nachkov/) explains autonomous vehicles and real-world
    decision-making on Bulgarian National Radio, highlighting the role of simulation
    and prediction in driving systems.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7417853102936018945/
- date: '2026-01-12'
  body: >-
    [DiffSim Trinity](/demos/diffsim-trinity/) is introduced as a differentiable-simulation
    paradigm for autonomous driving. It unifies sensing, action, and outcome so
    policies can train through physical dynamics, covering control, counterfactual
    planning, and online trajectory search.
  link_url: https://insait.ai/insait-introduces-diffsim-trinity-a-new-paradigm-for-autonomous-driving-based-on-differentiable-simulation/
- date: '2026-01-08'
  body: '[Ruibo Ming](/people/ruibo-ming/) joins INSAIT as a PhD student in the Computer
    Vision group, working on video generation, autonomous driving, 3D reconstruction,
    and multimodal systems.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7414947968514076672/
- date: '2025-12-26'
  body: '[Anna-Maria Halacheva](/people/anna-maria-halacheva/) discusses INSAIT''s
    CSRankings success and AI talent development on bTV, following the institute''s
    rise in European computer-science rankings.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7410295032437678080/
- date: '2025-12-22'
  body: INSAIT reaches 13th in Europe and 1st in Eastern Europe in CSRankings, with
    computer vision ranked 6th in Europe among the institute's tracked research areas.
  link_url: https://insait.ai/bulgarias-insait-ranks-13th-in-europe-overtaking-universities-in-oxford-london-amsterdam-and-berlin/
- date: '2025-12-17'
  body: '[Nikola Popovic](/people/nikola-popovic/) presents INSAIT''s large-scale
    3D dataset work in a Bulgarian National Radio interview, explaining why open 3D
    data matters for language-aware scene understanding.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7406973353695215616/
- date: '2025-12-16'
  body: INSAIT releases [SceneSplat-49k](https://insait.ai/insait-releases-the-worlds-largest-open-source-3d-dataset-and-benchmark-for-language-aware-ai-systems/),
    the largest open-source 3D Gaussian Splatting scene collection, together with
    a benchmark for language-aware 3D AI systems.
  link_url: https://insait.ai/insait-releases-the-worlds-largest-open-source-3d-dataset-and-benchmark-for-language-aware-ai-systems/
- date: '2025-12-05'
  body: INSAIT attends NeurIPS 2025 with 7 accepted papers and multiple workshop activities,
    including work connected to world models, video AI, and interactive environments.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7402640911760785408/
- date: '2025-11-25'
  body: Prof. Angela Yao visits INSAIT and meets the Computer Vision group, sharing
    perspectives from her work in human-centric and visual AI research.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7399047999395377153/
- date: '2025-11-20'
  body: '[StateSpaceDiffuser](/demos/statespace-diffuser/) is accepted to NeurIPS
    2025 as a diffusion-based world model for long-context spatial consistency. The
    work is led by [Nedko Savov](/people/nedko-savov/) with collaborators including
    [Deheng Zhang](/people/deheng-zhang/), [Danda Paudel](/people/danda-paudel/),
    and [Luc Van Gool](/people/luc-van-gool/).'
  link_url: https://insait.ai/insait-researchers-advance-video-ai-with-statespacediffuser/
- date: '2025-11-17'
  body: Cheng Tang joins INSAIT as a Computer Vision intern with [Luc Van Gool](/people/luc-van-gool/),
    focusing on RL-driven multimodal reasoning enhancement.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7396101380656222208/
- date: '2025-11-05'
  body: '[Letian Shi](/people/letian-shi/) joins INSAIT as a doctoral student in the
    Computer Vision group, working with [Luc Van Gool](/people/luc-van-gool/) and
    [Danda Paudel](/people/danda-paudel/).'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7391756028796735489/
- date: '2025-11-04'
  body: INSAIT presents 3 accepted robotics papers at IROS 2025, including work on
    autonomous-vehicle policies trained with differentiable simulation.
  link_url: https://insait.ai/insait-with-three-accepted-papers-at-iros-2025-one-of-the-worlds-leading-robotics-conferences/
- date: '2025-10-27'
  body: '[Nikolay Nikolov](/people/nikolay-nikolov/) presents [SPEAR-1](/demos/spear-1/)
    and robotic foundation models on bTV, describing how 3D understanding can improve
    robot behavior in the physical world.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7388494825379102720/
- date: '2025-10-25'
  body: '[SPEAR-1](/demos/spear-1/) is featured on Bulgarian National Television as
    a robotics foundation model built around spatial reasoning and 3D understanding.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7387755521057001472/
- date: '2025-10-23'
  body: >-
    [SPEAR-1](/demos/spear-1/) is released as Europe's first open robotic foundation
    model trained on 3D data. It matches or exceeds models such as OpenVLA and pi0.5
    with up to 20x less robot demonstration data. The team includes [Nikolay Nikolov](/people/nikolay-nikolov/),
    [Giuliano Albanese](/people/giuliano-albanese/), [Sombit Dey](/people/sombit-dey/),
    [Luc Van Gool](/people/luc-van-gool/), and [Danda Paudel](/people/danda-paudel/).
  link_url: https://insait.ai/insait-unveils-spear-1-europes-first-open-robotic-foundation-model-trained-on-3d-data/
- date: '2025-10-21'
  body: >-
    Physics-IQ, led by [Saman Motamed](/people/sam-motamed/) with Google DeepMind,
    is presented at ICCV 2025. The benchmark of 396 real-world videos shows that
    generative video models can look convincing while missing the underlying physical
    dynamics.
  link_url: https://insait.ai/new-benchmark-physics-iq-challenges-ai-video-models-understanding-of-the-physical-world/
- date: '2025-10-20'
  body: >-
    Jan-Nico Zaech gives an ICCV 2025 workshop keynote on foundation data for industrial
    transfer. The talk shows how human video and other non-robot data can support
    more capable robots, connecting [MotoVLA](/demos/motovla/), [ReVLA](/publications/revla-reverting-visual-domain-limitation-of-robotic-foundation-models/), [GaussianVLM](/demos/gaussianvlm/),
    and Articulate3D.
  link_url: https://insait.ai/nsait-featured-at-iccv-2025-workshop-on-foundation-data-for-industrial-tech-transfer/
- date: '2025-10-17'
  body: '[Stefan Ailuro](/people/stefan-ailuro/) joins INSAIT as a PhD student in
    Computer Vision, working with [Luc Van Gool](/people/luc-van-gool/) and [Danda
    Paudel](/people/danda-paudel/).'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7384852904169476096/
- date: '2025-10-16'
  body: INSAIT brings 14 accepted papers to ICCV 2025 in Hawaii, with a booth alongside
    Google, Meta, and Sony and work across robotics, embodied AI, 3D vision, and
    foundation models.
  link_url: https://insait.ai/insait-with-a-leading-presence-at-iccv-2025-one-of-the-worlds-top-ai-forums/
- date: '2025-10-08'
  body: INSAIT co-organizes the OpenSUN3D challenges at ICCV 2025 with Stanford, ETH
    Zurich, Google, NVIDIA, Microsoft, and TUM, advancing open-world 3D scene understanding.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7381588953218580480/
- date: '2025-10-07'
  body: >-
    [ObjectRelator](/demos/objectrelator/) is selected as a Highlight Paper at ICCV
    2025. The model relates the same object across egocentric and exocentric views,
    beyond single-image segmentation. [Danda Paudel](/people/danda-paudel/) and
    [Luc Van Gool](/people/luc-van-gool/) are among the authors.
  link_url: https://insait.ai/insait-research-selected-as-highlight-paper-at-iccv-2025/
- date: '2025-10-03'
  body: INSAIT's robotics team presents at CoRL 2025 and qualifies for the Real Robot
    Challenge, bringing the group's embodied-AI work into a leading robotics venue.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7379783760738865153/
- date: '2025-09-29'
  body: '[Generalist Robot Manipulation Beyond Action Labeled Data](/demos/motovla/)
    is accepted to CoRL 2025. The work studies how robot policies can learn from broader
    visual and 3D data, not only action-labeled demonstrations.'
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7378331877440573440/
- date: '2025-09-27'
  body: GAIA 2025 takes place in Sofia, bringing together researchers and industry
