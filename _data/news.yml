  body: INSAIT co-organizes the OpenSUN3D Workshop at ICCV 2025, focused on open-vocabulary
    and open-world 3D scene understanding.
  link_url: https://insait.ai/insait-to-co-organize-opensun3d-workshop-at-iccv-2025/
- date: '2025-08-05'
  body: INSAIT co-organizes the Physics-IQ Challenge at ICCV 2025, a benchmark for
    evaluating whether generative models produce physically plausible videos.
  link_url: https://insait.ai/insait-co-organizes-physics-iq-challenge-at-iccv-2025/
- date: '2025-07-23'
  body: Prof. Richard Hartley visits INSAIT and meets the Computer Vision group, giving
    a talk on modeling probability distributions in data manifolds using diffusion.
  link_url: https://www.linkedin.com/feed/update/urn:li:activity:7353692849156059136/
- date: '2025-07-21'
  body: INSAIT co-organizes the NeurIPS 2025 Workshop on Embodied World Models for
